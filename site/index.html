<body>
<div class="shell">

<script>
(function(){
'use strict';
var state={profile:null}, authUser=null, jobs=[], loading=false, error='', query='', family='All roles', toastTimer;
var families=['All roles','Logistics & Transportation','Warehousing & Fulfilment','Procurement & Sourcing','Demand & Supply Planning','SC Analytics & Data','Manufacturing & Operations','Network Design & Strategy','S&OP / IBP','SC Consulting'];
var domains=['Logistics','Warehousing','Procurement','Supply planning','Demand planning','S&OP / IBP','Manufacturing','Transportation','Supply chain analytics','Network design'];
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function initials(v){return String(v||'A').trim().split(/\s+/).map(x=>x[0]||'').join('').slice(0,2).toUpperCase()}
function icon(name){var paths={spark:'<path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3Z"/><path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',link:'<path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2A5 5 0 0 0 12 20.1l1.1-1.1"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>'};return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(paths[name]||'')+'</svg>'}
function shellHeader(){var el=document.getElementById('top-right');if(authUser){var name=authUser.name||authUser.email||'Aapurti user';el.innerHTML='<span class="top-email"><strong>'+esc(name)+'</strong></span><span class="avatar">'+esc(initials(name))+'</span><a class="account-signout" href="/signout-with-chatgpt?return_to=%2F" target="_top">Sign out</a>'}else{el.innerHTML='<span>Supply chain careers, made personal</span>'}}
function onboarding(){shellHeader();var p=state.profile||{},step=p.stage==='profile'?2:1;document.getElementById('app').innerHTML='<section class="auth-wrap"><div class="auth-story"><div class="eyebrow">Built for supply chain careers</div><h1>Find work that <span>moves</span> the world.</h1><p>Tell Aapurti what you know. We’ll find roles that fit your experience and help you reach people who can open the right door.</p><div class="story-art"><svg class="story-road" viewBox="0 0 540 235" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M-10 77 C100 78 92 145 210 143 S335 59 420 76 S500 139 560 131" fill="none" stroke="#76927b" stroke-width="28" stroke-linecap="round"/><path d="M-10 77 C100 78 92 145 210 143 S335 59 420 76 S500 139 560 131" fill="none" stroke="#dce6d2" stroke-width="2" stroke-dasharray="7 10" stroke-linecap="round"/><circle cx="70" cy="80" r="9" fill="#D6EF45"/><circle cx="289" cy="113" r="9" fill="#D6EF45"/><circle cx="475" cy="102" r="9" fill="#2457D6"/><g transform="translate(367 53)"><path d="M0 8h31v18H0z" fill="#D6EF45" rx="3"/><path d="M31 14h12l8 8v4H31z" fill="#f6f1e4"/><circle cx="11" cy="29" r="5" fill="#142437"/><circle cx="39" cy="29" r="5" fill="#142437"/><path d="M36 16v6h10" fill="none" stroke="#1E4775" stroke-width="2"/></g><path d="M463 69v22m-8-9 8-8 8 8" stroke="#f6f1e4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="art-label"><b>Routes that fit you</b>From your experience to your next role</div></div></div><div class="auth-card" id="auth-card"></div></section>';step===1?loginStep():profileStep()}
function stepbar(step){return '<div class="step-indicator"><span class="'+(step>=1?'on':'')+'"></span><span class="'+(step>=2?'on':'')+'"></span></div><div class="step-meta"><span>Step '+step+' of 2</span><span>'+ (step===1?'Your account':'Your work profile')+'</span></div>'}
function loginStep(){var card=document.getElementById('auth-card');if(!authUser){card.innerHTML=stepbar(1)+'<h2>Sign in to Aapurti.</h2><p class="intro">Your profile is tied to your signed-in account, so your work history and matches follow you between devices.</p><a class="btn btn-primary" href="/signin-with-chatgpt?return_to=%2F" target="_top">Sign in with ChatGPT</a><p class="privacy-note">Your account handles sign-in. Aapurti does not ask for or store a separate password.</p>';return}card.innerHTML=stepbar(1)+'<h2>Your account.</h2><p class="intro">You are signed in as <strong>'+esc(authUser.email||authUser.name||'Aapurti user')+'</strong>. Your profile will be saved to your account in Aapurti.</p><div class="form-actions"><span></span><button class="btn btn-primary" type="button" id="continue-profile">Continue '+icon('arrow')+'</button></div><p class="privacy-note">No Aapurti password is stored. Sign-in is handled by your account.</p>';document.getElementById('continue-profile').addEventListener('click',profileStep)}
function chipGroup(values,selected,name){return values.map(function(v){var id=name+'-'+v.toLowerCase().replace(/[^a-z0-9]+/g,'-');return '<span class="chip"><input type="checkbox" id="'+esc(id)+'" name="'+esc(name)+'" value="'+esc(v)+'" '+(selected.indexOf(v)>=0?'checked':'')+'><label for="'+esc(id)+'">'+esc(v)+'</label></span>'}).join('')}
function profileStep(){var card=document.getElementById('auth-card');if(!card){onboarding();return}shellHeader();var p=state.profile||{},picked=p.domains||[];card.innerHTML=stepbar(2)+'<h2>What have you worked on?</h2><p class="intro">We’ll use your domains, skills and seniority to surface relevant openings and make your outreach sound like you.</p><form id="profile-form" class="fields"><div class="field full"><label for="companies">Previous companies</label><input id="companies" placeholder="e.g. Fractal Analytics, VECV" value="'+esc((p.companies||[]).join(', '))+'"><p class="hint">Separate companies with commas.</p></div><div class="field"><label for="experience">Total work experience</label><select id="experience"><option value="">Select</option>'+['0–2 years','3–5 years','6–8 years','9–12 years','12+ years'].map(function(x){return '<option '+(p.experience===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div class="field"><label for="level">Target level</label><select id="level"><option value="">Select</option>'+['Individual contributor','Manager','Senior manager','Product manager','Open to suitable roles'].map(function(x){return '<option '+(p.level===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div class="field full"><label>Domains you know</label><div class="domain-options">'+chipGroup(domains,picked,'domains')+'</div></div><div class="field full"><label for="skills">Skills and tools</label><input id="skills" placeholder="e.g. demand planning, SQL, Power BI, optimization" value="'+esc(p.skills||'')+'"></div><div class="field"><label for="locations">Preferred locations</label><input id="locations" placeholder="India, Bengaluru, Remote" value="'+esc(p.locations||'')+'"></div><div class="field"><label for="titles">Role titles you want</label><input id="titles" placeholder="e.g. Product, planning, logistics" value="'+esc(p.titles||'')+'"></div><div class="field full form-actions"><button class="back" type="button" id="back-login">← Back</button><button class="btn btn-primary" type="submit" id="save-profile">Save profile '+icon('arrow')+'</button></div></form><p class="privacy-note">Your profile is saved to Aapurti and linked to your signed-in account.</p>';document.getElementById('back-login').addEventListener('click',loginStep);document.getElementById('profile-form').addEventListener('submit',async function(e){e.preventDefault();var data=new FormData(e.target),button=document.getElementById('save-profile'),original=button.innerHTML;var updated={name:authUser.name||authUser.email||'Aapurti user',email:authUser.email||'',stage:'ready',companies:document.getElementById('companies').value.split(',').map(function(x){return x.trim()}).filter(Boolean),experience:document.getElementById('experience').value,level:document.getElementById('level').value,domains:data.getAll('domains'),skills:document.getElementById('skills').value.trim(),locations:document.getElementById('locations').value.trim(),titles:document.getElementById('titles').value.trim()};button.disabled=true;button.textContent='Saving profile…';try{var response=await fetch('/api/me',{method:'PUT',headers:{'content-type':'application/json','accept':'application/json'},body:JSON.stringify(updated)});var result=await response.json();if(!response.ok)throw new Error(result.error||'Profile could not be saved');state.profile=result.profile;clearMigratedProfile(authUser);dashboard();loadJobs();notify('Profile saved to your Aapurti account')}catch(err){button.disabled=false;button.innerHTML=original;notify(err.message||'Could not save profile. Try again.')}})}
function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function profileTokens(){var p=state.profile||{};return [].concat(p.domains||[],(p.skills||'').split(','),(p.titles||'').split(',')).map(norm).filter(function(x){return x.length>2})}
function scoreJob(j){var p=state.profile||{},title=norm(j.title),body=norm((j.description||'').slice(0,2000)),familyText=norm(j.family),tokens=profileTokens(),hits=0,reasons=[];tokens.forEach(function(t){if((title+' '+body+' '+familyText).indexOf(t)>=0){hits++;if(reasons.length<3)reasons.push(t)}});var score=58+Math.min(23,hits*8);if(p.level&&/manager/i.test(p.level)&&/manager|lead|director|head/i.test(title)){score+=8;reasons.push('level aligned')}if(p.experience&&/0 2|3 5/.test(norm(p.experience))&&/senior|director|head/i.test(title)){score-=7}if(p.titles&&p.titles.split(',').some(function(t){return t.trim()&&title.indexOf(norm(t.trim()))>=0})){score+=8;reasons.push('target title')}score=Math.max(52,Math.min(97,score));return {score:score,reasons:reasons.slice(0,3)}}
function relevant(j){var s=scoreJob(j);return s.score>=55}
function linkedinUrl(q){return 'https://www.linkedin.com/search/results/people/?keywords='+encodeURIComponent(q)}
function referralMessage(j){var p=state.profile||{},company=(p.companies||[]).length?'My previous experience includes '+p.companies.join(' and '):'My experience is in '+((p.domains||[]).join(', ')||'supply chain');var domains=(p.domains||[]).slice(0,3).join(', ');if(domains)company+='; I’ve worked across '+domains;if(p.experience)company+=' over '+p.experience.toLowerCase();return 'Hi [Name], I came across the '+j.title+' role at '+j.company+' and it caught my eye. '+company+'. I’m exploring my next move in '+(j.family||'supply chain')+' and would value your perspective on the team and role. If you feel my background could fit, would you be comfortable referring me? No worries if not. Thank you!'}
function dashboard(){shellHeader();var p=state.profile||{};document.getElementById('app').innerHTML='<div class="dashboard-head"><div><div class="eyebrow">Your next move, mapped</div><h1>Good to see you, '+esc((p.name||'').split(' ')[0])+'.</h1><p>Open supply chain roles ranked against your experience and interests.</p></div><div class="updated"><div id="updated">Connecting to employer career sites…</div><button class="refresh" id="refresh">'+icon('arrow')+' Refresh roles</button></div></div><section class="route-board" aria-label="Supply chain route from your experience to a relevant role"><div class="route-copy"><div class="route-kicker">Your next move, mapped</div><h2>Experience in motion.</h2><p>Aapurti routes your background through the right supply chain functions, then surfaces open roles at the other end.</p><div class="route-legend"><i></i>Your experience <i></i>Role-fit hub <i></i>Open opportunity</div></div><div class="route-map"><svg class="route-svg" viewBox="0 0 760 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="A route connects your experience, a warehouse role-fit hub, and a new opportunity"><path d="M30 139 C140 139 125 58 262 65 S370 151 482 119 S600 59 734 71" fill="none" stroke="#B8C7D8" stroke-width="25" stroke-linecap="round"/><path d="M30 139 C140 139 125 58 262 65 S370 151 482 119 S600 59 734 71" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="7 10" stroke-linecap="round"/><circle class="route-node" cx="96" cy="126" r="17"/><circle class="route-pin" cx="96" cy="126" r="5"/><text class="route-node-label" x="58" y="163">YOUR EXPERIENCE</text><circle class="route-node" cx="407" cy="137" r="18"/><path d="M396 132h22v14h-22zm-3 0 14-10 14 10m-19 0v14m10-14v14" fill="none" stroke="#1E4775" stroke-width="2" stroke-linejoin="round"/><text class="route-node-label" x="363" y="171">ROLE-FIT HUB</text><circle class="route-node" cx="663" cy="66" r="17"/><path d="M663 55v22m-8-9 8-8 8 8" fill="none" stroke="#2457D6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text class="route-node-label" x="621" y="99">OPEN ROLE</text><g class="route-truck" transform="translate(507 72)"><rect x="0" y="4" width="39" height="25" rx="4" fill="#1E4775"/><rect x="6" y="9" width="12" height="15" rx="1" fill="#D6EF45"/><rect x="21" y="9" width="12" height="15" rx="1" fill="#D6EF45"/><path d="M39 11h15l10 10v8H39z" fill="#2457D6"/><path d="M45 15h7l6 6H45z" fill="#FFFFFF"/><circle cx="13" cy="33" r="6" fill="#142437"/><circle cx="51" cy="33" r="6" fill="#142437"/><circle cx="13" cy="33" r="2" fill="#d8dfd1"/><circle cx="51" cy="33" r="2" fill="#d8dfd1"/></g><text class="route-line-label" x="251" y="35">SUPPLY CHAIN CAREER ROUTE</text></svg></div></section><section class="overview"><div class="profile-signal"><div class="signal-head"><div><h2>Your experience signal</h2><p>These details shape your match results and referral drafts.</p></div><button class="edit-profile" id="edit-profile">Edit profile ↗</button></div><div class="signal-tags">'+(p.companies||[]).map(function(c){return '<span class="signal-tag"><strong>Company</strong> · '+esc(c)+'</span>'}).join('')+(p.experience?'<span class="signal-tag"><strong>Experience</strong> · '+esc(p.experience)+'</span>':'')+(p.domains||[]).map(function(d){return '<span class="signal-tag">'+esc(d)+'</span>'}).join('')+'</div></div><div class="match-stat"><strong id="match-count">—</strong><span>roles matched to your profile</span><small>Match scores explain which parts of your profile align.</small></div></section><div class="toolbar"><div class="filters" id="filters"></div><label class="search">'+icon('search')+'<input id="search" placeholder="Search title, company or location"></label></div><p class="match-note">'+icon('spark')+'Ranked by domain, skills and seniority. LinkedIn searches open live people results; Aapurti does not invent profile data.</p><section id="job-list" class="job-list"><div class="loading"><i class="spinner"></i> Checking public employer postings…</div></section><div class="footer-note"><span>Roles link to the employer’s original posting. Posting availability can change.</span><span>Profile saved to your Aapurti account · <a href="#" id="reset-profile">Delete profile</a></span></div>';renderFilters();document.getElementById('edit-profile').addEventListener('click',function(){state.profile.stage='profile';onboarding()});document.getElementById('refresh').addEventListener('click',function(){loadJobs(true)});document.getElementById('search').addEventListener('input',function(e){query=e.target.value;renderJobs()});document.getElementById('reset-profile').addEventListener('click',function(e){e.preventDefault();if(confirm('Delete your Aapurti profile? You can create it again later.')){deleteProfile()}});renderJobs()}
function renderFilters(){document.getElementById('filters').innerHTML=['All roles','Strong matches'].concat(families.slice(1)).map(function(f){return '<button class="filter '+(family===f?'active':'')+'" data-family="'+esc(f)+'">'+esc(f)+'</button>'}).join('');document.querySelectorAll('[data-family]').forEach(function(b){b.addEventListener('click',function(){family=b.dataset.family;renderFilters();renderJobs()})})}
function dateLabel(v){if(!v)return 'Recently posted';var d=new Date(v);if(isNaN(d))return 'Recently posted';var days=Math.floor((Date.now()-d.getTime())/86400000);return days<=0?'Today':days===1?'1 day ago':days+' days ago'}
function jobCard(j){var match=scoreJob(j),company=esc(j.company||'Employer'),title=esc(j.title),location=esc(j.location||'Location not supplied'),fam=esc(j.family||'Supply chain'),initial=esc(initials(j.company)),q1=company+' supply chain '+fam,q2=company+' recruiter talent acquisition',q3=company+' '+(state.profile.companies||[]).join(' ')+' alumni';return '<article class="job-card"><div><div class="job-top"><div class="company-mark">'+initial+'</div><div><h2 class="job-title">'+title+'</h2><div class="job-meta"><strong>'+company+'</strong><i class="meta-dot"></i><span>'+location+'</span><i class="meta-dot"></i><span>'+esc(dateLabel(j.postedAt))+'</span></div></div></div><div class="job-tags"><span class="job-tag family">'+fam+'</span>'+((j.tags||[]).slice(0,3).map(function(t){return '<span class="job-tag">'+esc(t)+'</span>'}).join(''))+'</div><div class="match-reasons">'+(match.reasons.length?match.reasons.map(function(r){return '<span><i class="check">✓</i>'+esc(r)+'</span>'}).join(''):'<span><i class="check">✓</i>Supply chain role</span>')+'</div></div><aside class="job-aside"><div class="match-score"><div class="score-ring" style="--score:'+match.score+'"><b>'+match.score+'</b></div><div class="match-copy"><strong>Profile match</strong><span>Based on your background</span></div></div><div class="people-row"><strong>People to reach at '+company+'</strong><div class="people-links"><a target="_blank" rel="noopener" href="'+linkedinUrl(q1)+'">Team members</a><a target="_blank" rel="noopener" href="'+linkedinUrl(q2)+'">Recruiters</a><a target="_blank" rel="noopener" href="'+linkedinUrl(q3)+'">Shared alumni</a></div></div><div class="job-actions"><button class="btn btn-linkedin" data-draft="'+esc(j.id)+'">Draft referral note</button><a class="btn btn-open" target="_blank" rel="noopener" href="'+esc(j.url)+'">View role ↗</a></div></aside></article>'}
function renderJobs(){var list=document.getElementById('job-list');if(!list)return;var matches=jobs.filter(function(j){return relevant(j)}).filter(function(j){return family==='All roles'||family==='Strong matches'&&scoreJob(j).score>=78||j.family===family}).filter(function(j){var hay=norm([j.title,j.company,j.location,j.family].join(' '));return !query||hay.indexOf(norm(query))>=0}).sort(function(a,b){return scoreJob(b).score-scoreJob(a).score||new Date(b.postedAt||0)-new Date(a.postedAt||0)});var count=document.getElementById('match-count');if(count)count.textContent=loading?'…':matches.length;if(loading&&!jobs.length){list.innerHTML='<div class="loading"><i class="spinner"></i> Checking public employer postings…</div>';return}if(!matches.length){list.innerHTML='<div class="empty"><h3>'+(error?'Could not load the live roles':'No roles match these filters yet')+'</h3><p>'+(error?esc(error):'Try another function or search term, or refresh the employer feeds.')+'</p></div>';return}list.innerHTML=matches.slice(0,80).map(jobCard).join('');document.querySelectorAll('[data-draft]').forEach(function(b){b.addEventListener('click',function(){var j=jobs.find(function(x){return x.id===b.dataset.draft});if(j)showDraft(j)})})}
function showDraft(j){var q1=j.company+' supply chain '+j.family,q2=j.company+' recruiter talent acquisition',q3=j.company+' '+(state.profile.companies||[]).join(' ')+' alumni';document.getElementById('modal').innerHTML='<div class="modal-head"><div><div class="eyebrow">A thoughtful first note</div><h2>Reach out about '+esc(j.title)+'</h2><p>Open LinkedIn people search, then adapt this draft to the person you contact.</p></div><button class="close" id="close-modal" aria-label="Close">×</button></div><div class="modal-people"><a target="_blank" rel="noopener" href="'+linkedinUrl(q1)+'">Search team members ↗</a><a target="_blank" rel="noopener" href="'+linkedinUrl(q2)+'">Search recruiters ↗</a><a target="_blank" rel="noopener" href="'+linkedinUrl(q3)+'">Search shared alumni ↗</a></div><div class="message-box" id="message">'+esc(referralMessage(j))+'</div><div class="modal-actions"><button class="btn btn-light" id="copy-message">Copy message</button><a class="btn btn-primary" target="_blank" rel="noopener" href="'+esc(j.url)+'">Open role ↗</a></div>';document.getElementById('modal-shade').classList.add('open');document.getElementById('close-modal').addEventListener('click',closeModal);document.getElementById('copy-message').addEventListener('click',function(){navigator.clipboard.writeText(referralMessage(j)).then(function(){notify('Referral message copied')}).catch(function(){notify('Select and copy the draft text')})})}
function closeModal(){document.getElementById('modal-shade').classList.remove('open')}
function notify(s){var t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show')},2300)}
async function loadJobs(force){loading=true;error='';renderJobs();try{var r=await fetch('/api/jobs'+(force?'?refresh=1':''),{headers:{accept:'application/json'}});if(!r.ok)throw new Error('Job feed returned '+r.status);var data=await r.json();jobs=Array.isArray(data.jobs)?data.jobs:[];error=data.warning||'';loading=false;var stamp=document.getElementById('updated');if(stamp)stamp.textContent='Live from employer career sites · updated '+new Date(data.updatedAt||Date.now()).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'});renderJobs()}catch(e){loading=false;error='We could not reach the employer career feeds. Refresh to try again.';var stamp=document.getElementById('updated');if(stamp)stamp.textContent='Feed connection unavailable';renderJobs();console.error(e)}}
document.getElementById('modal-shade').addEventListener('click',function(e){if(e.target.id==='modal-shade')closeModal()});document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal()});
function legacyProfile(user){try{var old=JSON.parse(localStorage.getItem('aapurti.profile.v2')||'null');return old&&user.email&&String(old.email||'').toLowerCase()===String(user.email).toLowerCase()?old:{}}catch(e){return {}}}
function clearMigratedProfile(user){try{var old=JSON.parse(localStorage.getItem('aapurti.profile.v2')||'null');if(old&&user.email&&String(old.email||'').toLowerCase()===String(user.email).toLowerCase())localStorage.removeItem('aapurti.profile.v2')}catch(e){}}
async function bootstrap(){try{var r=await fetch('/api/me',{headers:{accept:'application/json'}});if(r.status===401||r.status===403){authUser=null;state.profile=null;onboarding();return}if(!r.ok)throw new Error('Could not load your account');var data=await r.json();authUser=data.user;state.profile=data.profile?Object.assign({},data.profile,{name:data.user.name||data.profile.name,email:data.user.email||data.profile.email,stage:'ready'}):Object.assign({},legacyProfile(data.user),{name:data.user.name||data.user.email,email:data.user.email,stage:'profile'});if(data.profile){clearMigratedProfile(data.user);dashboard();loadJobs()}else{onboarding()}}catch(e){document.getElementById('app').innerHTML='<div class="empty"><h3>Account service unavailable</h3><p>Aapurti could not reach your profile store. Your information has not been discarded. Refresh this page to retry.</p></div>';console.error(e)}}
async function deleteProfile(){try{var r=await fetch('/api/me',{method:'DELETE',headers:{accept:'application/json'}});if(!r.ok)throw new Error('Could not delete profile');state.profile={name:authUser.name||authUser.email,email:authUser.email,stage:'profile'};onboarding();notify('Profile deleted')}catch(e){notify(e.message||'Could not delete profile')}}

bootstrap();
})();
</script>
